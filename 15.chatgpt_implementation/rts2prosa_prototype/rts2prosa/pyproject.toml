[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rts2prosa"
version = "0.1.0"
description = "Compiler-style semantic lowering of RTS papers to verified Prosa/Rocq scripts"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "transformers>=4.51",
  "accelerate>=1.0",
  "torch>=2.4",
  "bitsandbytes>=0.44",
  "beautifulsoup4>=4.12",
  "scikit-learn>=1.5"
]

[project.scripts]
rts2prosa = "rts2prosa.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rts2prosa*"]
